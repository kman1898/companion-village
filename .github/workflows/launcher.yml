name: Launcher

# Builds the desktop launcher for macOS, Windows and Linux.
# Pushing a tag like `launcher-v1.0.0` also publishes the builds as a GitHub release.
on:
  push:
    tags: ['launcher-v*']
  pull_request:
    paths: ['launcher/**', 'src/**', '.github/workflows/launcher.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            launcher/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: launcher
      - name: Build the launcher
        working-directory: launcher
        run: npm run dist -- ${{ matrix.target }} --publish never
        env:
          # no code-signing certificates: builds are unsigned (see launcher/README.md)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ runner.os }}
          path: |
            launcher/release/*.dmg
            launcher/release/*.zip
            launcher/release/*.exe
            launcher/release/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/launcher-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Companion Village Launcher ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
